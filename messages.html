<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messages | Sangat Works</title>
  <link rel="stylesheet" href="css/style.css" />
  <script>
    const target = new URL('network.html', window.location.href);
    const current = new URL(window.location.href);
    target.searchParams.set('tab', 'messages');
    ['conversation', 'user'].forEach((key) => {
      const value = current.searchParams.get(key);
      if (value) target.searchParams.set(key, value);
    });
    window.location.replace(target.href);
  </script>
</head>
<body>
  <main class="page-wrap">
    <section class="form-card">
      <h1>Messages have moved</h1>
      <p>Redirecting to My Network &amp; Messages...</p>
      <a class="btn-primary" href="network.html?tab=messages">Open Messages</a>
    </section>
  </main>
</body>
</html>
